name: Build iOS HV
on:
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: 'Force rebuild sysroot?'
        required: true
        default: 'false'
      upload_release:
        description: 'Upload UTM-HV.ipa to a release tag?'
        required: true
        default: 'false'
      release_tag:
        description: 'Release tag (required if upload_release=true)'
        required: false
        default: ''

permissions:
  contents: write

env:
  BUILD_XCODE_PATH: /Applications/Xcode_26.0.app
  RUNNER_IMAGE: macos-15
  QEMU_TARGET_LIST: aarch64-softmmu,x86_64-softmmu,i386-softmmu

jobs:
  configuration:
    name: Setup configuration
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.checker.outputs.runners }}
      github-runner: ${{ steps.checker.outputs.github-runner }}
    steps:
      - name: Check for hosted runners
        id: checker
        shell: bash
        env:
          IS_SELF_HOSTED_RUNNER: ${{ vars.IS_SELF_HOSTED_RUNNER || (github.repository_owner == 'utmapp' && 'true') }}
        run: |
          echo "github-runner='$RUNNER_IMAGE'" >> $GITHUB_OUTPUT
          if [ "$IS_SELF_HOSTED_RUNNER" == "true" ]; then
            echo "runners=['self-hosted', 'macOS']" >> $GITHUB_OUTPUT
          else
            echo "runners='$RUNNER_IMAGE'" >> $GITHUB_OUTPUT
          fi

  build-sysroot:
    name: Build Sysroot
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: configuration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Xcode
        shell: bash
        run: |
          [[ "$(xcode-select -p)" == "${{ env.BUILD_XCODE_PATH }}"* ]] || sudo xcode-select -s "${{ env.BUILD_XCODE_PATH }}"
      - name: Check Cache
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-ios-arm64
          key: ios-arm64-hv-${{ hashFiles('scripts/build_dependencies.sh') }}-${{ hashFiles('patches/**') }}-${{ github.sha }}
          restore-keys: ios-arm64-hv-${{ hashFiles('scripts/build_dependencies.sh') }}-${{ hashFiles('patches/**') }}-
          lookup-only: false
      - name: Setup Path
        shell: bash
        run: |
          echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
      - name: Install Requirements
        if: (steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true') && fromJSON(needs.configuration.outputs.runner) == env.RUNNER_IMAGE
        run: |
          brew uninstall cmake
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake
          brew install llvm spirv-llvm-translator libxcb libxrandr libclc spirv-tools
          python3 -m pip install --break-system-packages six pyparsing pyyaml setuptools distlib mako
          python3 -c "import six; print('six OK:', six.__file__)"
          rm -f /usr/local/lib/pkgconfig/*.pc
      - name: Build Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: ./scripts/build_dependencies.sh -p ios -a arm64
        env:
          NCPU: 0
          QEMU_TARGET_LIST: ${{ env.QEMU_TARGET_LIST }}
      - name: Compress Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: tar -acf sysroot.tgz sysroot*
      - name: Upload Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sysroot-ios-arm64-hv
          path: sysroot.tgz
      - name: Save Cache
        if: steps.cache-sysroot.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ./sysroot-ios-arm64
          key: ${{ steps.cache-sysroot.outputs.cache-primary-key }}
          upload-chunk-size: 1048576

  build-utm:
    name: Build UTM
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: [configuration, build-sysroot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache Sysroot
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-ios-arm64
          key: ios-arm64-hv-${{ hashFiles('scripts/build_dependencies.sh') }}-${{ hashFiles('patches/**') }}-${{ github.sha }}
          restore-keys: ios-arm64-hv-${{ hashFiles('scripts/build_dependencies.sh') }}-${{ hashFiles('patches/**') }}-
          fail-on-cache-miss: true
      - name: Setup Xcode
        shell: bash
        run: |
          [[ "$(xcode-select -p)" == "${{ env.BUILD_XCODE_PATH }}"* ]] || sudo xcode-select -s "${{ env.BUILD_XCODE_PATH }}"
          xcodebuild -downloadPlatform iOS
      - name: Build UTM
        run: |
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM
          tar -acf UTM.xcarchive.tgz UTM.xcarchive
      - name: Upload UTM
        uses: actions/upload-artifact@v4
        with:
          name: UTM-iOS-ios-arm64
          path: UTM.xcarchive.tgz

  package-ios:
    name: Package (iOS)
    runs-on: ${{ fromJSON(needs.configuration.outputs.github-runner) }}
    needs: [configuration, build-utm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: UTM-iOS-ios-arm64
      - name: Install ldid + dpkg
        run: brew install ldid dpkg
      - name: Validate release inputs
        if: github.event.inputs.upload_release == 'true' && github.event.inputs.release_tag == ''
        run: |
          echo "release_tag is required when upload_release=true"
          exit 1
      - name: Fakesign IPA
        run: |
          tar -xf UTM.xcarchive.tgz
          ./scripts/package.sh ipa-hv UTM.xcarchive .
          mv UTM.ipa UTM-HV.ipa
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-HV.ipa
          path: UTM-HV.ipa
      - name: Upload Release Asset
        if: github.event.inputs.upload_release == 'true' && github.event.inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.release_tag }}" UTM-HV.ipa --clobber --repo "${{ github.repository }}"
